name: audio_app_ing3
description: Application audio sécurisée - ING3 USTHB
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.2.0

  # Biométrie
  local_auth: ^2.3.0

  # Audio
  just_audio: ^0.9.39
  just_audio_background: ^0.0.1-beta.11
  audio_service: ^0.18.14

  # State Management
  flutter_riverpod: ^2.5.1

  # HTTP / API
  dio: ^5.4.3

  # Graphiques
  fl_chart: ^0.68.0

  # Stockage local
  shared_preferences: ^2.3.1
  flutter_secure_storage: ^9.2.2

  # Navigation
  go_router: ^14.2.0

  # UI
  lottie: ^3.1.2
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Utilitaires
  intl: ^0.19.0
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/